<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://192.168.0.100:5174; connect-src 'self' blob: http://192.168.0.100:5174 http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:;"
    />
    <title>Compagnon</title>
    <link rel="stylesheet" href="./face_rig/face_rig.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 6px 8px 10px;
        box-sizing: border-box;
        gap: 4px;
        -webkit-app-region: drag;
      }
      .bubble {
        display: none;
        max-width: 200px;
        margin-bottom: 4px;
        padding: 8px 10px;
        border-radius: 14px 14px 14px 4px;
        background: rgba(2, 6, 23, 0.92);
        border: 1px solid rgba(94, 234, 212, 0.45);
        color: #e2e8f0;
        font-size: 11px;
        line-height: 1.35;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
        -webkit-app-region: no-drag;
        animation: pop-in 0.28s ease;
      }
      .bubble.visible {
        display: block;
      }
      .bubble.guide .bubble-actions {
        display: none;
      }
      .bubble-msg {
        margin: 0 0 6px;
      }
      .bubble.guide .bubble-msg {
        margin: 0;
      }
      .bubble-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .pointer {
        display: none;
        position: absolute;
        top: 42%;
        width: 0;
        height: 0;
        border-style: solid;
        filter: drop-shadow(0 0 6px rgba(45, 212, 191, 0.85));
        animation: point-nudge 0.7s ease-in-out infinite;
        z-index: 5;
        pointer-events: none;
      }
      .pointer.visible.left {
        display: block;
        left: 2px;
        border-width: 10px 16px 10px 0;
        border-color: transparent #5eead4 transparent transparent;
      }
      .pointer.visible.right {
        display: block;
        right: 2px;
        left: auto;
        border-width: 10px 0 10px 16px;
        border-color: transparent transparent transparent #5eead4;
      }
      @keyframes point-nudge {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(-5px);
        }
      }
      .pointer.visible.right {
        animation-name: point-nudge-r;
      }
      @keyframes point-nudge-r {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(5px);
        }
      }
      body.guiding #face-wrap {
        animation: alert-pulse 0.85s ease-in-out 4;
      }
      .bubble-actions button {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
      }
      .bubble-actions .agir {
        background: #10b981;
        color: #022c22;
      }
      .bubble-actions .later {
        background: transparent;
        color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .drag-handle {
        width: 72px;
        height: 10px;
        margin-bottom: 2px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.45);
        -webkit-app-region: no-drag;
        cursor: grab;
        flex-shrink: 0;
      }
      .drag-handle:active {
        cursor: grabbing;
        background: rgba(94, 234, 212, 0.7);
      }
      #face-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        -webkit-app-region: no-drag;
        cursor: pointer;
        animation: idle-bob 3.2s ease-in-out infinite;
      }
      body.mode-vrm .stage {
        padding: 0 !important;
        margin: 0 !important;
        justify-content: flex-end;
      }
      body.mode-vrm #face-wrap {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        animation: none;
      }
      body.mode-vrm.framing-full #face-wrap {
        width: 100% !important;
        height: 100% !important;
      }
      body.mode-vrm.framing-bust #face-wrap {
        width: 220px;
        height: 320px;
      }
      #face-wrap.alert {
        animation: alert-pulse 0.9s ease-in-out 3;
      }
      #face-host {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(94, 234, 212, 0.45);
        background: radial-gradient(
          circle at 40% 28%,
          rgba(30, 58, 95, 0.95),
          rgba(2, 6, 23, 0.98)
        );
        box-shadow:
          0 0 0 4px rgba(15, 23, 42, 0.35),
          0 0 20px rgba(34, 211, 238, 0.2),
          0 12px 32px rgba(0, 0, 0, 0.55);
      }
      body.mode-vrm #face-host {
        width: 100% !important;
        height: 100% !important;
        border-radius: 0;
        border: none;
        background: transparent !important;
        box-shadow: none;
      }
      body.mode-vrm .drag-handle {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.25s ease;
        z-index: 10;
      }
      body.mode-vrm:hover .drag-handle {
        opacity: 0.85;
      }
      body.mode-vrm #face-host canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      .status {
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.03em;
        color: #99f6e4;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        max-width: 200px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body.mode-vrm .status {
        position: absolute;
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
        z-index: 10;
      }
      body.mode-vrm:hover .status {
        opacity: 0.9;
      }
      .session-pill {
        display: none;
        max-width: 200px;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(56, 189, 248, 0.4);
        color: #e0f2fe;
        font-size: 10px;
        line-height: 1.3;
        -webkit-app-region: no-drag;
      }
      .session-pill.visible {
        display: block;
      }
      .session-pill .agent {
        font-weight: 700;
        color: #7dd3fc;
      }
      .session-pill .ticker {
        margin: 2px 0 0;
        opacity: 0.9;
      }
      .session-pill .session-actions {
        display: none;
        gap: 4px;
        margin-top: 6px;
      }
      .session-pill.needs-approval .session-actions {
        display: flex;
      }
      .session-pill .session-actions button {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
      }
      .session-pill .allow {
        background: #38bdf8;
        color: #0c4a6e;
      }
      .session-pill .deny {
        background: transparent;
        color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      @keyframes idle-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      @keyframes alert-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div id="pointer" class="pointer" aria-hidden="true"></div>
      <div id="session-pill" class="session-pill" aria-live="polite">
        <div class="agent" id="session-agent">opencode</div>
        <p class="ticker" id="session-ticker"></p>
        <div class="session-actions">
          <button type="button" class="allow" id="btn-allow">Allow</button>
          <button type="button" class="deny" id="btn-deny">Deny</button>
        </div>
      </div>
      <div id="bubble" class="bubble" aria-live="polite">
        <p id="bubble-msg" class="bubble-msg"></p>
        <div class="bubble-actions">
          <button type="button" class="agir" id="btn-agir">Agir</button>
          <button type="button" class="later" id="btn-later">Plus tard</button>
        </div>
      </div>
      <div id="drag-handle" class="drag-handle" title="Glisser pour deplacer"></div>
      <div id="face-wrap" title="Ouvrir le Compagnon">
        <div id="face-host"></div>
      </div>
      <div id="status" class="status">Compagnon</div>
    </div>
    <script src="./face_rig/face_rig.js"></script>
    <script src="./vrm/vrm_pet.bundle.js"></script>
    <script src="./overlay.js"></script>
    <script>
      if (typeof window.__onVrmPetReady === "function") window.__onVrmPetReady();
    </script>
  </body>
</html>

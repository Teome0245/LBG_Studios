<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexura Domina - Clip Officiel 9:16 (Choreographer 3D)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #03050c;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Cadre 9:16 Centré Purement Isolé (Zéro Bureau) */
  #clip-container {
    position: relative;
    width: 540px;
    height: 960px;
    overflow: hidden;
    background: #03050c;
  }

  /* Stage Background & Effets Scéniques */
  #canvas-stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Hôte Avatar 3D VRM */
  #avatar-host {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  /* Top Card HUD (Shorts / TikTok Style) */
  #top-hud {
    position: absolute;
    top: 24px;
    left: 5%;
    width: 90%;
    background: rgba(13, 18, 34, 0.88);
    border: 1.5px solid rgba(0, 245, 212, 0.65);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 245, 212, 0.25);
    backdrop-filter: blur(12px);
    z-index: 20;
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .badge-live {
    background: rgba(0, 245, 212, 0.15);
    border: 1px solid #00f5d4;
    color: #00f5d4;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .badge-pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00f5d4;
    box-shadow: 0 0 8px #00f5d4;
    animation: livePulse 1s infinite alternate;
  }
  @keyframes livePulse {
    from { opacity: 0.4; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1.3); }
  }

  .badge-audio {
    background: rgba(244, 63, 94, 0.15);
    border: 1px solid #f43f5e;
    color: #f43f5e;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .hud-title {

    font-size: 18px;
    font-weight: 900;

    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 245, 212, 0.3);

  .hud-motion-info {

    justify-content: space-between;

    font-family: monospace;

  /* Bottom Equalizer Card */
  #bottom-hud {

    left: 5%;

    background: rgba(13, 18, 34, 0.88);
    border: 1.5px solid rgba(244, 63, 94, 0.5);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(12px);
    z-index: 20;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #audio-bars-canvas {
    width: 100%;
    height: 28px;
    display: block;
  }

  /* Indicateur de préparation pour l'enregistreur */
  #render-flag {
    display: none;
    position: absolute;
    top: 2px;
    left: 2px;
    width: 4px;
    height: 4px;
    background: #00ff00;
    z-index: 9999;
  }
</style>
</head>
<body>

<audio id="audio-player" src="./nexura_domina_v1.mp3" preload="auto"></audio>

<script src="./vrm/vrm_pet.bundle.js?v=choreographer_v1"></script>

<script>
// =========================================================================
// Chorégraphie officielle composée par l'utilisateur (22 séquences précises)
// =========================================================================
let sequenceData = null;

async function loadChoreo() {
  try {
    const res = await fetch("/api/load_sequence");
    const data = await res.json();
    if (data && data.motions && data.motions.length > 0) {
      sequenceData = data;
      console.log("[RenderClip] Chorégraphie chargée depuis le serveur:", sequenceData.motions.length, "mouvements.");
      return;
    }
  } catch (_) {}

  // Repli automatique sur le JSON exact de l'utilisateur
  sequenceData = {
    audio: "nexura_domina_v1.mp3",
    duration: 157.61,
    bpm: 128,
    motions: [
      { start: 0, end: 3.52, file: "Female Dance Pose1.vrma", name: "Female Dance Pose1", speed: 1 },
      { start: 3.48, end: 9.28, file: "Female Crouch Pose.vrma", name: "Female Crouch Pose", speed: 1 },
      { start: 9.34, end: 12.38, file: "Samba Dancing1.vrma", name: "Samba Dancing1", speed: 1 },
      { start: 12.44, end: 14.4, file: "Jazz Dancing3.vrma", name: "Jazz Dancing3", speed: 1 },
      { start: 14.44, end: 25.28, file: "Bellydancing.vrma", name: "Bellydancing", speed: 1 },
      { start: 25.33, end: 70.29, file: "samba.vrma", name: "samba", speed: 1 },
      { start: 70.41, end: 72.25, file: "jump.vrma", name: "jump", speed: 1 },
      { start: 72.28, end: 74.56, file: "Pro_Magic_Pack_Standing 2H Cast Spell 01.vrma", name: "Pro_Magic_Pack_Standing 2H Cast Spell 01", speed: 1 },
      { start: 74.55, end: 76.63, file: "Pro_Magic_Pack_Standing 2H Magic Area Attack 01.vrma", name: "Pro_Magic_Pack_Standing 2H Magic Area Attack 01", speed: 1 },
      { start: 76.68, end: 81.4, file: "Dwarf Idle.vrma", name: "Dwarf Idle", speed: 1 },
      { start: 81.45, end: 83.11, file: "Pro_Magic_Pack_standing 1H cast spell 01.vrma", name: "Pro_Magic_Pack_standing 1H cast spell 01", speed: 1 },
      { start: 83.1, end: 86.83, file: "Air Squat Bent Arms.vrma", name: "Air Squat Bent Arms", speed: 1 },
      { start: 86.83, end: 92.51, file: "Crazy Gesture.vrma", name: "Crazy Gesture", speed: 1 },
      { start: 92.51, end: 110.47, file: "Hip Hop Dancing3.vrma", name: "Hip Hop Dancing3", speed: 1 },
      { start: 110.53, end: 129.85, file: "Bellydancing.vrma", name: "Bellydancing", speed: 1 },
      { start: 129.83, end: 130.35, file: "Female Dance Pose.vrma", name: "Female Dance Pose", speed: 1 },
      { start: 130.92, end: 131.32, file: "Female Dance Pose1.vrma", name: "Female Dance Pose1", speed: 1 },
      { start: 131.94, end: 132.34, file: "Female Dance Pose.vrma", name: "Female Dance Pose", speed: 1 },
      { start: 133.05, end: 144.09, file: "Hip Hop Dancing3.vrma", name: "Hip Hop Dancing3", speed: 1 },
      { start: 144.13, end: 148.21, file: "Taunt.vrma", name: "Taunt", speed: 1 },
      { start: 148.12, end: 150.73, file: "Pro_Magic_Pack_Standing 2H Magic Area Attack 02.vrma", name: "Pro_Magic_Pack_Standing 2H Magic Area Attack 02", speed: 1 },
      { start: 150.7, end: 157.61, file: "Dwarf Idle.vrma", name: "Dwarf Idle", speed: 1 }
    ],
    cameras: [
      { start: 0, end: 144.02, preset: "full", name: "Silhouette Complète" },
      { start: 144.08, end: 157.6, preset: "full", name: "Plan Large Final" }
    ],
    expressions: [
      { start: 0, end: 14.5, preset: "mystique", name: "Intro Regard Mystique" },
      { start: 14.5, end: 46, preset: "diva", name: "Couplet Chant Passionné" },
      { start: 46, end: 78, preset: "idol", name: "Montée Sourire Idol" },
      { start: 78, end: 112, preset: "climax", name: "Drop Climax Vocal" },
      { start: 112, end: 142, preset: "diva", name: "Solo Vocal Scénique" },
      { start: 142, end: 157.6, preset: "mystique", name: "Outro Présence Diva" }
    ]
  };
}

let petInstance = null;
let currentMotion = "";
const audio = document.getElementById("audio-player");
let audioCtx, analyser, dataArray;

async function init() {
  await loadChoreo();
  const hostEl = document.getElementById("avatar-host");

  window.petInstance = petInstance = window.__createVrmPet(hostEl, {
    modelUrl: "./vrm/Compagnon.vrm",
    framing: "full"
  });

  const checkReady = setInterval(() => {
    if (petInstance && petInstance.ready) {
      clearInterval(checkReady);
      console.log("[RenderClip] Avatar prêt ! Démarrage du concert 9:16...");
      onReady();
    }
  }, 100);

  initStageCanvas();
  setupAudio();
}

let videoPlaybackStartTime = null;
let isVideoPlaying = false;

function onReady() {
  if (petInstance.setMicVisible) petInstance.setMicVisible(true);
  if (petInstance.setCamera) {
    petInstance.setCamera({ dist: 4.25, height: 0.85, lookY: 0.85, fov: 28, immediate: true });
  }
  // Adopter la pose d'introduction en attendant le clap
  if (petInstance.playVRMA) {
    petInstance.playVRMA("Female Dance Pose1.vrma", { loop: true });
  }

  // Marquer prêt pour l'enregistreur
  document.getElementById("render-flag").style.display = "block";
  window.__READY_FOR_RECORD = true;

  // Démarrage de sécurité automatique après 4s si pas de déclenchement externe
  setTimeout(() => {
    if (!isVideoPlaying) startPlaybackNow();
  }, 4000);
}

function startPlaybackNow() {
  if (isVideoPlaying) return;
  try {
    audio.currentTime = 0;
    audio.play().catch(e => { console.warn("Audio autoplay:", e); });
  } catch (_) {}

  videoPlaybackStartTime = performance.now();
  isVideoPlaying = true;
  console.log("[RenderClip] Performance démarrée !");
}

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.key === " " || e.key === "Enter") {
    startPlaybackNow();
  }
});

window.addEventListener("click", () => {
  startPlaybackNow();
});

function updateChoreo(curT) {
  // Format timecode
  const mins = Math.floor(curT / 60);
  const secs = curT % 60;
  document.getElementById("hud-timecode").innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs.toFixed(2)} / 02:37.61`;

  // Mouvement actif
  const activeMotion = sequenceData.motions.find(m => curT >= m.start && curT < m.end);
  if (activeMotion && activeMotion.file !== currentMotion) {
    currentMotion = activeMotion.file;
    document.getElementById("hud-motion-name").innerText = activeMotion.name;
    if (petInstance.playVRMA) {
      petInstance.playVRMA(activeMotion.file, { loop: true });
    }
    if (petInstance.setSpeed) {
      petInstance.setSpeed(activeMotion.speed || 1.0);
    }
  }

  // Expression active
  const activeExp = sequenceData.expressions.find(e => curT >= e.start && curT < e.end);
  if (activeExp) {
    document.getElementById("hud-exp-name").innerText = activeExp.name;
  }

  // Caméra active & Mouvements Drone Mobiles
  updateCameraAtTime(curT);
}

const CAM_PRESETS = {
  full: { type: 'fixed', dist: 4.25, lookY: 0.85, fov: 28, name: "Silhouette Complète" },
  mid: { type: 'fixed', dist: 3.10, lookY: 1.00, fov: 27, name: "Plan Américain" },
  bust: { type: 'fixed', dist: 1.80, lookY: 1.28, fov: 25, name: "Buste Diva" },
  closeup: { type: 'fixed', dist: 1.15, lookY: 1.38, fov: 23, name: "Gros Plan Émotion" },
  drone_orbit: { type: 'mobile', mode: 'orbit', dist: 3.90, lookY: 0.90, fov: 28, rotations: 1, name: "🛸 Drone Orbit 360°" },
  drone_orbit_close: { type: 'mobile', mode: 'orbit', dist: 2.10, lookY: 1.25, fov: 25, rotations: 1, name: "💫 Drone Orbit Buste" },
  drone_arc180: { type: 'mobile', mode: 'arc180', dist: 3.40, lookY: 0.95, fov: 28, name: "🔄 Drone Arc 180°" },
  push_in: { type: 'mobile', mode: 'push_in', distStart: 4.30, distEnd: 1.70, lookYStart: 0.85, lookYEnd: 1.32, fov: 26, name: "🚀 Travelling Avant" },
  pull_out: { type: 'mobile', mode: 'pull_out', distStart: 1.70, distEnd: 4.30, lookYStart: 1.32, lookYEnd: 0.85, fov: 26, name: "🌌 Travelling Arrière" },
  sway: { type: 'mobile', mode: 'sway', dist: 3.20, lookY: 0.95, fov: 28, name: "🌊 Balancement Beat" }
};

let currentCamPreset = null;
function updateCameraAtTime(curTime) {
  const activeCam = sequenceData.cameras.find(c => curTime >= c.start && curTime < c.end);
  if (!activeCam || !petInstance) return;

  const key = activeCam.preset || "full";
  const p = CAM_PRESETS[key] || CAM_PRESETS["full"];

  if (p.type === 'mobile') {
    const dur = Math.max(0.1, activeCam.end - activeCam.start);
    const progress = Math.max(0, Math.min(1, (curTime - activeCam.start) / dur));

    if (p.mode === 'orbit') {
      const angle = progress * Math.PI * 2 * (p.rotations || 1);
      petInstance.setCamera({ dist: p.dist, lookY: p.lookY, height: p.lookY + 0.1, angle, fov: p.fov, immediate: true });
    } else if (p.mode === 'arc180') {
      const angle = -Math.PI * 0.5 + progress * Math.PI;
      petInstance.setCamera({ dist: p.dist, lookY: p.lookY, height: p.lookY + 0.1, angle, fov: p.fov, immediate: true });
    } else if (p.mode === 'push_in') {
      const dist = p.distStart + (p.distEnd - p.distStart) * progress;
      const lookY = p.lookYStart + (p.lookYEnd - p.lookYStart) * progress;
      petInstance.setCamera({ dist, lookY, height: lookY + 0.08, angle: 0, fov: p.fov, immediate: true });
    } else if (p.mode === 'pull_out') {
      const dist = p.distStart + (p.distEnd - p.distStart) * progress;
      const lookY = p.lookYStart + (p.lookYEnd - p.lookYStart) * progress;
      petInstance.setCamera({ dist, lookY, height: lookY + 0.08, angle: 0, fov: p.fov, immediate: true });
    } else if (p.mode === 'sway') {
      const angle = Math.sin(progress * Math.PI * 6) * 0.35;
      petInstance.setCamera({ dist: p.dist, lookY: p.lookY, height: p.lookY + 0.1, angle, fov: p.fov, immediate: true });
    }
  } else {
    if (activeCam.preset !== currentCamPreset) {
      currentCamPreset = activeCam.preset;
      petInstance.setCamera({ dist: p.dist, lookY: p.lookY, fov: p.fov, angle: 0, immediate: true });
    }
  }
}

// =========================================================================
// Scénographie Cyberpunk & Sol Miroir Dynamique (Style TikTok / Shorts)
// =========================================================================
function initStageCanvas() {
  const canvas = document.getElementById("canvas-stage");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = 540;
    canvas.height = 960;
  }
  window.addEventListener("resize", resize);
  resize();

  const particles = [];
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: Math.random() * 540,
      y: Math.random() * 960,
      size: 1 + Math.random() * 2.5,
      speed: 0.8 + Math.random() * 1.5,
      color: Math.random() > 0.5 ? "rgba(0, 245, 212," : "rgba(244, 63, 94,"
    });
  }

  function render(now) {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Fond dégradé scène de concert
    const grad = ctx.createRadialGradient(w/2, h*0.45, 30, w/2, h/2, Math.max(w, h)*0.75);
    grad.addColorStop(0, "#0c152a");
    grad.addColorStop(0.5, "#060914");
    grad.addColorStop(1, "#020308");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Projecteurs volumétriques
    const t = now * 0.001;
    ctx.save();
    ctx.globalAlpha = 0.12;

    const p1 = ctx.createLinearGradient(0, 0, w * 0.4, h);
    p1.addColorStop(0, "#00f5d4");
    p1.addColorStop(1, "transparent");
    ctx.fillStyle = p1;
    ctx.beginPath();
    ctx.moveTo(w * 0.1, 0);
    ctx.lineTo(w * 0.5 + Math.sin(t * 1.5) * 50, h);
    ctx.lineTo(w * 0.25, h);
    ctx.fill();

    const p2 = ctx.createLinearGradient(w, 0, w * 0.6, h);
    p2.addColorStop(0, "#f43f5e");
    p2.addColorStop(1, "transparent");
    ctx.fillStyle = p2;
    ctx.beginPath();
    ctx.moveTo(w * 0.9, 0);
    ctx.lineTo(w * 0.5 + Math.cos(t * 1.5) * 50, h);
    ctx.lineTo(w * 0.75, h);
    ctx.fill();
    ctx.restore();

    // Grille Cyberpunk perspective au sol
    const horizonY = h * 0.72;
    const speedOffset = (t * 2.0) % 1.0;
    ctx.lineWidth = 1.2;
    const numLines = 12;
    for (let k = 0; k < numLines; k++) {
      const normK = (k + speedOffset) / numLines;
      const gy = horizonY + (h - horizonY) * Math.pow(normK, 2.2);
      ctx.strokeStyle = `rgba(0, 245, 212, ${normK * 0.35})`;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(w, gy);
      ctx.stroke();
    }
    const stepX = w * 0.15;
    for (let vx = -w * 0.3; vx <= w * 1.3; vx += stepX) {
      ctx.strokeStyle = "rgba(0, 245, 212, 0.18)";
      ctx.beginPath();
      ctx.moveTo(w * 0.5, horizonY - 60);
      ctx.lineTo(vx, h);
      ctx.stroke();
    }

    // Particules néon montantes
    for (const p of particles) {
      p.y -= p.speed;
      if (p.y < 0) { p.y = h; p.x = Math.random() * w; }
      ctx.fillStyle = p.color + "0.6)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Mise à jour continue et fluide de la chorégraphie et des caméras drone à 60 FPS
    if (isVideoPlaying && videoPlaybackStartTime !== null) {
      const curT = (now - videoPlaybackStartTime) / 1000.0;
      updateChoreo(Math.min(sequenceData.duration, curT));
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

// =========================================================================
// Equalizer Audio & Lipsync Temps Réel
// =========================================================================
function setupAudio() {
  const barsCanvas = document.getElementById("audio-bars-canvas");
  const barsCtx = barsCanvas.getContext("2d");

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) {
    console.warn("AudioContext init:", e);
  }

  function drawBars() {
    barsCtx.clearRect(0, 0, barsCanvas.width, barsCanvas.height);
    if (isVideoPlaying && videoPlaybackStartTime !== null) {
      const curT = (performance.now() - videoPlaybackStartTime) / 1000.0;
      const beat = curT * (128 / 60) * Math.PI * 2;
      const activeExp = sequenceData.expressions.find(e => curT >= e.start && curT < e.end);
      const preset = activeExp ? activeExp.preset : "silence";
      const isSinging = preset !== "silence";

      // Égaliseur audio et analyse FFT réelle de la voix (asservissement Atelier)
      let voiceRms = 0;
      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        let voiceSum = 0;
        let voiceCount = 0;
        for (let i = 2; i < 18; i++) {
          voiceSum += dataArray[i];
          voiceCount++;
        }
        voiceRms = (voiceSum / (voiceCount * 255)) * 1.5;
      }

      // Animation dynamique de l'égaliseur audio
      const count = 24;
      const barW = barsCanvas.width / count - 2;
      for (let i = 0; i < count; i++) {
        const val = analyser && dataArray ? Math.max(0.12, (dataArray[i % dataArray.length] / 255.0)) : Math.max(0.12, Math.abs(Math.sin(beat * 0.5 + i * 0.45)) * (isSinging ? 0.90 : 0.40));
        const h = val * barsCanvas.height;
        barsCtx.fillStyle = i < 12 ? "#00f5d4" : "#f43f5e";
        barsCtx.fillRect(i * (barW + 2), barsCanvas.height - h, barW, h);
      }

      // Lipsync vocal & expressions scéniques en direct calés sur la voix
      if (petInstance && petInstance.setLiveSinging) {
        let mouthA = 0, mouthO = 0, mouthI = 0;
        let relaxedVal = 0.35, happyVal = 0, blinkVal = 0;

        if (isSinging && voiceRms > 0.07) {
          const energy = Math.min(1.0, (voiceRms - 0.07) * 1.6);
          if (preset === "climax") {
            mouthA = Math.min(1.0, energy * 1.25);
            mouthO = Math.sin(curT * 12) > 0.15 ? energy * 0.50 : 0;
            relaxedVal = 0.85;
            blinkVal = 0.40 + Math.sin(curT * 4) * 0.20;
          } else if (preset === "idol") {
            mouthA = energy * 0.65;
            mouthI = energy * 0.35;
            happyVal = 0.75;
            relaxedVal = 0.50;
            blinkVal = 0.05;
          } else if (preset === "mystique") {
            mouthA = energy * 0.55;
            mouthO = energy * 0.40;
            relaxedVal = 0.45;
            blinkVal = 0.25;
          } else {
            // diva
            mouthA = energy * 0.88;
            mouthO = Math.sin(curT * 10) > 0.25 ? energy * 0.45 : 0;
            mouthI = 0.20;
            relaxedVal = 0.70;
            blinkVal = 0.35 + Math.sin(curT * 5) * 0.15;
          }
        } else {
          // Pause / Respiration scénique : bouche fermée naturelle
          if (preset === "idol") happyVal = 0.50;
          if (preset === "mystique") relaxedVal = 0.40;
          if (preset === "diva" || preset === "climax") relaxedVal = 0.30;
        }

        petInstance.setLiveSinging(true, {
          aa: mouthA,
          oh: mouthO,
          ih: mouthI,
          relaxed: relaxedVal,
          happy: happyVal,
          blink: blinkVal
        });
      }
    }
    requestAnimationFrame(drawBars);
  }
  requestAnimationFrame(drawBars);
}

window.addEventListener("DOMContentLoaded", init);
</script>

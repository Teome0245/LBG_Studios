server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Agir + vision-ask : Cortex Pilot (.140) — timeouts longs (27B CPU / images)
    location /api/pilot/ {
        proxy_pass http://192.168.0.140:8000/v1/pilot/;
        proxy_http_version 1.1;
        client_max_body_size 16m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Build prod : axios baseURL = `/api` → même origine que le SPA (5174 en mapping hôte)
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        # Évite les 504 quand une requête backend prend du temps (LLM, agents, probes).
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # SPA Orch UI (chat produit) — plus de redirect forcé vers Pilot (P3 assoupli 2026-08-25)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

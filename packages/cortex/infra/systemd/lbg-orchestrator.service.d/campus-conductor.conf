[Service]
# Drain file Team — ne pas dépendre uniquement de /etc/lbg-ia-mmo.env
# (push_secrets peut omettre les clés CAMPUS et laisser le timer tourner à vide).
Environment=LBG_TEAM_CAMPUS_CONDUCTOR_ENABLED=1
Environment=LBG_TEAM_CAMPUS_CONDUCTOR_MAX_BUSY=4
Environment=LBG_TEAM_CAMPUS_CONDUCTOR_MAX_STARTS=2
Environment=LBG_TEAM_CAMPUS_CONDUCTOR_JOB_ENABLED=1
Environment=LBG_TEAM_CAMPUS_CONDUCTOR_ROLES=qa,ops,pm,admin_infra,dev_game,dev_godot,dev_studio,player_ia

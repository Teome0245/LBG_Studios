<?xml version="1.0" encoding="UTF-8"?>
<!-- Tatooine — coords SWG, nord = haut. viewBox: wx+6500, 6500-wy. Sans filtre (compat Godot). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13000 13000" width="1300" height="1300">
  <defs>
    <radialGradient id="sand" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="55%" stop-color="#b8956a"/>
      <stop offset="100%" stop-color="#8a6b42"/>
    </radialGradient>
    <radialGradient id="dune" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a574" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7a5c38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe08a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8a317" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fond espace / bord planète -->
  <rect width="13000" height="13000" fill="#120e0a"/>
  <ellipse cx="6500" cy="6500" rx="6200" ry="6100" fill="url(#sand)" stroke="#5a4228" stroke-width="40"/>
  <!-- Dunes (pas de feGaussianBlur — Godot SVG) -->
  <ellipse cx="3200" cy="4200" rx="1800" ry="900" fill="url(#dune)"/>
  <ellipse cx="9800" cy="7800" rx="2200" ry="1100" fill="url(#dune)"/>
  <ellipse cx="5200" cy="10200" rx="1600" ry="800" fill="url(#dune)"/>
  <ellipse cx="8800" cy="2800" rx="1400" ry="700" fill="url(#dune)"/>
  <ellipse cx="7000" cy="6000" rx="1200" ry="600" fill="url(#dune)"/>
  <!-- Routes sable (traits fins) -->
  <g fill="none" stroke="#a88858" stroke-width="28" stroke-opacity="0.35" stroke-linecap="round">
    <path d="M 2500 12500 L 6400 11900 L 10020 11300"/>
    <path d="M 10020 11300 L 11309 7298 L 10700 1300"/>
    <path d="M 6400 11900 L 3600 4300"/>
    <path d="M 11309 7298 L 8800 2800"/>
  </g>
  <!-- Grille légère -->
  <g stroke="#6b5030" stroke-width="8" opacity="0.12">
    <line x1="0" y1="6500" x2="13000" y2="6500"/>
    <line x1="6500" y1="0" x2="6500" y2="13000"/>
    <line x1="0" y1="3250" x2="13000" y2="3250"/>
    <line x1="0" y1="9750" x2="13000" y2="9750"/>
    <line x1="3250" y1="0" x2="3250" y2="13000"/>
    <line x1="9750" y1="0" x2="9750" y2="13000"/>
  </g>
  <!-- Villes -->
  <g font-family="Segoe UI, DejaVu Sans, sans-serif" fill="#f0e6d2">
    <circle cx="10020" cy="11300" r="120" fill="#8b6914" stroke="#fff8e8" stroke-width="20"/>
    <text x="10020" y="11680" text-anchor="middle" font-size="160" fill="#e8dcc8">Mos Eisley</text>
    <circle cx="6400" cy="11900" r="90" fill="#6b5030" stroke="#ddd" stroke-width="16"/>
    <text x="6400" y="12220" text-anchor="middle" font-size="140">Anchorhead</text>
    <circle cx="2500" cy="12500" r="90" fill="#6b5030" stroke="#ddd" stroke-width="16"/>
    <text x="2500" y="12820" text-anchor="middle" font-size="140">Bestine</text>
    <circle cx="3600" cy="4300" r="100" fill="#7a5c38" stroke="#ddd" stroke-width="16"/>
    <text x="3600" y="4620" text-anchor="middle" font-size="140">Mos Espa</text>
    <circle cx="10700" cy="1300" r="90" fill="#6b5030" stroke="#ddd" stroke-width="16"/>
    <text x="10700" y="1620" text-anchor="middle" font-size="140">Wayfar</text>
    <!-- Lost Heaven — hub joueur -->
    <ellipse cx="11309" cy="7298" rx="220" ry="220" fill="url(#lhGlow)"/>
    <circle cx="11309" cy="7298" r="130" fill="#e8a317" stroke="#fff8e0" stroke-width="24"/>
    <text x="11309" y="7680" text-anchor="middle" font-size="150" fill="#ffe8a0" font-weight="bold">Lost Heaven</text>
  </g>
  <text x="6500" y="620" text-anchor="middle" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="220" fill="#998870">Tatooine — coords serveur SWG</text>
</svg>
